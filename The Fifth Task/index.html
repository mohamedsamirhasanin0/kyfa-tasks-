<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">
  <title>Frontend Mentor | Results summary component</title>
  <link rel="stylesheet" href="result.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:ital,wght@0,100..900;1,100..900&display=swap"
    rel="stylesheet">
</head>

<body class="container">
  <main class="cards">
    <div class="Result">
      <h3>Your Result</h3>
      <div>
        <div class="score-circle">
          <h2>76</h2>
          <p>of 100</p>
        </div>
      </div>
      <h4 class="great">Great</h4>
      <p class="percent">You scored higher than 65% of the people who have taken these tests.</p>
    </div>

    <div class="summary">
      <h3>Summary</h3>
      <div class="reaction">
        <div class="grades">
          <img src="./assets/images/icon-reaction.svg" alt="reaction icon">
          <p>Reaction</p>
        </div>
        <p class="score"><span>80</span> / 100</p>
      </div>

      <div class="memory">
        <div class="grades">
          <img src="./assets/images/icon-memory.svg" alt="memory icon">
          <p>Memory</p>
        </div>
        <p class="score"><span>92</span> / 100</p>
      </div>

      <div class="verbal">
        <div class="grades">
          <img src="./assets/images/icon-verbal.svg" alt="verbal icon">
          <p>Verbal</p>
        </div>
        <p class="score"><span>61</span> / 100</p>
      </div>

      <div class="visual">
        <div class="grades">
          <img src="./assets/images/icon-visual.svg" alt="visual icon">
          <p>Visual</p>
        </div>
        <p class="score"><span>72</span> / 100</p>
      </div>

      <a href="#" class="continue-btn">Continue</a>
    </div>
  </main>
</body>

</html>
