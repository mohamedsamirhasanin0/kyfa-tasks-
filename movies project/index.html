<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Movie Watchlist</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
    <div class="container">
      <a class="navbar-brand font-weight-bold" href="#">🎬 Movie Watchlist</a>
    </div>
  </nav>

  <div class="container mb-5">

    <div class="row mb-4 text-center">
      <div class="col-md-4 mb-2">
        <div class="card stat-card bg-primary text-white p-3">
          <h5>Total Movies</h5>
          <h2 id="totalMovies">0</h2>
        </div>
      </div>
      <div class="col-md-4 mb-2">
        <div class="card stat-card bg-success text-white p-3">
          <h5>Watched</h5>
          <h2 id="watchedMovies">0</h2>
        </div>
      </div>
      <div class="col-md-4 mb-2">
        <div class="card stat-card bg-warning text-dark p-3">
          <h5>Avg Rating</h5>
          <h2 id="avgRating">0</h2>
        </div>
      </div>
    </div>

    <div class="row">

      <div class="col-lg-5 mb-4">
        <div class="card p-3 shadow-sm">
          <h4 class="mb-3">Add New Movie</h4>
          <form id="movieForm">
            <div class="mb-2">
              <label class="form-label">Movie Title</label>
              <input type="text" id="titleInput" class="form-control" placeholder="Enter title">
              <small id="titleError" class="text-danger"></small>
            </div>

            <div class="mb-2">
              <label class="form-label">Genre</label>
              <select id="genreInput" class="form-select">
                <option value="">Select Genre</option>
                <option value="Action">Action</option>
                <option value="Comedy">Comedy</option>
                <option value="Drama">Drama</option>
                <option value="Horror">Horror</option>
                <option value="Sci-Fi">Sci-Fi</option>
              </select>
              <small id="genreError" class="text-danger"></small>
            </div>

            <div class="mb-2">
              <label class="form-label">Release Year</label>
              <input type="number" id="yearInput" class="form-control" placeholder="1900 - 2027">
              <small id="yearError" class="text-danger"></small>
            </div>

            <div class="mb-3">
              <label class="form-label">Rating (1-5)</label>
              <select id="ratingInput" class="form-select">
                <option value="">Select Rating</option>
                <option value="1">1 ⭐</option>
                <option value="2">2 ⭐⭐</option>
                <option value="3">3 ⭐⭐⭐</option>
                <option value="4">4 ⭐⭐⭐⭐</option>
                <option value="5">5 ⭐⭐⭐⭐⭐</option>
              </select>
              <small id="ratingError" class="text-danger"></small>
            </div>

            <button type="submit" class="btn btn-primary w-100">Add Movie</button>
          </form>
        </div>
      </div>

      <div class="col-lg-7">

        <div class="card p-3 mb-4 shadow-sm">
          <div class="row g-2">
            <div class="col-md-6">
              <input type="text" id="searchInput" class="form-control" placeholder="Search by title...">
            </div>
            <div class="col-md-6">
              <select id="filterGenre" class="form-select">
                <option value="All">All Genres</option>
                <option value="Action">Action</option>
                <option value="Comedy">Comedy</option>
                <option value="Drama">Drama</option>
                <option value="Horror">Horror</option>
                <option value="Sci-Fi">Sci-Fi</option>
              </select>
            </div>
            <div class="col-md-6">
              <select id="sortBy" class="form-select">
                <option value="default">Sort By...</option>
                <option value="rating">Rating (High to Low)</option>
                <option value="year">Year (Newest First)</option>
              </select>
            </div>
            <div class="col-md-6">
              <button id="randomBtn" class="btn btn-purple w-100">🎲 What to watch?</button>
            </div>
          </div>
        </div>

        <div id="randomAlert" class="alert alert-info d-none" role="alert"></div>

        <div id="movieGrid" class="row"></div>
      </div>
    </div>

  </div>

  <script src="script.js"></script>
</body>
</html>
