<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact</title>
</head>
<body>
  <form method="get" action="#">
    <!-- GET sends data in the URL, so values appear in the address bar like ?name=mohamed. -->
    <!-- POST sends data in the request body and is better for sensitive or larger data. -->
    <label for="name">Name</label>
    <input type="text" id="name" name="name" />
    <button type="submit">Send</button>
  </form>
</body>
</html>
