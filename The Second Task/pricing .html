<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pricing</title>
</head>
<body>
  <table border="10">
    <caption>Monthly Pricing Plans</caption>
    <thead>
      <tr>
        <th scope="col">Plan</th>
        <th scope="col">Features</th>
        <th scope="col">Price</th>
      </tr>
    </thead>
    <tbody>
      <tr>
        <th scope="row">Basic</th>
        <td>1 project, email support</td>
        <td>$10/month</td>
      </tr>
      <tr>
        <th scope="row">Pro</th>
        <td>5 projects, priority support</td>
        <td>$25/month</td>
      </tr>
      <tr>
        <th scope="row">Enterprise</th>
        <td colspan="2">Unlimited projects, dedicated manager</td>
      </tr>
    </tbody>
  </table>
</body>
</html>
